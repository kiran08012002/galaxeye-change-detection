# EO-SAR Binary Change Detection — Configuration
model:
  architecture: UNet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 4        # R, G, B (EO pre-event) + 1 (SAR post-event)
  classes: 1
  activation: null

data:
  image_size: 256
  batch_size: 16
  num_workers: 2
  dataset: doron333/change-detection-dataset
  # Train split indices
  train_pre_start: 2781
  train_post_start: 0
  train_target_start: 5562
  n_train: 2781
  # Val split indices
  val_pre_start: 334
  val_post_start: 0
  val_target_start: 668
  n_val: 334
  # Test split indices
  test_pre_start: 77
  test_post_start: 0
  test_target_start: 154
  n_test: 77

training:
  epochs: 4
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: AdamW
  scheduler: CosineAnnealingLR
  loss: DiceBCE
  pos_weight: 4.30       # from class distribution analysis
  random_seed: 42

augmentation:
  train:
    - RandomCrop: 256
    - HorizontalFlip: 0.5
    - VerticalFlip: 0.5
    - RandomRotate90: 0.5
  val:
    - CenterCrop: 256
